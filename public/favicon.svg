<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Gradient matching site theme -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141724" />
      <stop offset="100%" stop-color="#0a0b10" />
    </linearGradient>

    <!-- Exact diagonal gradient from user reference image: 
         Top-Left Electric Blue/Violet (#2b1fd2 / #3a22e0) 
         through Deep Magenta/Purple (#7a1384 / #950f69) 
         to Bottom-Right Vivid Crimson/Red (#d3062b / #e60a32) -->
    <linearGradient id="pickGradient" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#2a22e5" />
      <stop offset="25%" stop-color="#4e1ab0" />
      <stop offset="55%" stop-color="#84117a" />
      <stop offset="78%" stop-color="#b70a46" />
      <stop offset="100%" stop-color="#e6082c" />
    </linearGradient>

    <filter id="pickGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.10)" stroke-width="8" />

  <!-- Soft Ambient Glow behind pick -->
  <circle cx="256" cy="270" r="160" fill="#b70a46" opacity="0.2" filter="url(#pickGlow)" />

  <!-- Guitar Pick matching user's image shape & angle -->
  <!-- Curvature: smooth rounded dome on top, tapering elegantly to bottom tip -->
  <path d="M 155 130 
           C 205 98, 307 98, 357 130 
           C 415 168, 420 262, 380 340 
           C 340 420, 282 452, 256 462 
           C 230 452, 172 420, 132 340 
           C 92 262, 97 168, 155 130 Z"
        fill="url(#pickGradient)" 
        filter="url(#pickGlow)" />

  <!-- Inner Soft Light/Specular curve giving it depth -->
  <path d="M 175 142 
           C 215 118, 297 118, 337 142 
           C 375 172, 380 230, 360 280 
           C 345 230, 315 160, 256 150 
           C 197 160, 167 230, 152 280 
           C 132 230, 137 172, 175 142 Z" 
        fill="#ffffff" 
        opacity="0.12" />
</svg>
